---
# Baseline hardening for a jump host / edge-management box: the kind of
# internet-facing system that edge-device APT campaigns go after first.
# Pair with scripts/host-exposure-audit.sh to verify the result.
#
#   ansible-playbook playbooks/harden-linux-host.yml -l jump_hosts --check --diff   # dry run
#   ansible-playbook playbooks/harden-linux-host.yml -l jump_hosts
- name: Harden Linux jump host
  hosts: jump_hosts
  vars:
    ssh_allowed_users: [ubuntu]
    ssh_max_auth_tries: 3
    ssh_port: 22
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart auditd
      ansible.builtin.service:
        name: auditd
        state: restarted

  pre_tasks:
    - name: Refuse to disable passwords if no SSH key is authorized
      ansible.builtin.stat:
        path: "/home/{{ item }}/.ssh/authorized_keys"
      loop: "{{ ssh_allowed_users }}"
      register: keys

    - name: Assert every allowed user has an authorized key
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "{{ item.item }} has no authorized_keys - hardening would lock you out"
      loop: "{{ keys.results }}"
      loop_control:
        label: "{{ item.item }}"

  tasks:
    - name: Apply all security updates
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install security packages
      ansible.builtin.apt:
        name: [auditd, fail2ban, unattended-upgrades, ufw]
        state: present

    - name: Deploy hardened sshd configuration
      ansible.builtin.template:
        src: ../templates/sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart sshd

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Firewall - allow SSH only
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Firewall - default deny incoming
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Audit rules for identity and privilege changes
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-identity.rules
        content: |
          -w /etc/passwd -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/sudoers -p wa -k privilege
          -w /etc/sudoers.d/ -p wa -k privilege
          -w /etc/ssh/sshd_config -p wa -k sshd
          -w /etc/ssh/sshd_config.d/ -p wa -k sshd
        mode: "0640"
      notify: Restart auditd

    - name: Kernel network hardening
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/60-hardening.conf
        reload: true
      loop: "{{ sysctl_settings | dict2items }}"
      vars:
        sysctl_settings:
          net.ipv4.conf.all.accept_redirects: 0
          net.ipv4.conf.all.send_redirects: 0
          net.ipv4.conf.all.accept_source_route: 0
          net.ipv4.conf.all.rp_filter: 1
          net.ipv4.tcp_syncookies: 1
          kernel.kptr_restrict: 2
          kernel.dmesg_restrict: 1

    - name: Enable security services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [auditd, fail2ban]

  post_tasks:
    - name: Copy exposure audit script
      ansible.builtin.copy:
        src: ../../scripts/host-exposure-audit.sh
        dest: /usr/local/sbin/host-exposure-audit
        mode: "0750"

    - name: Verify hardening
      ansible.builtin.command: /usr/local/sbin/host-exposure-audit
      register: audit
      changed_when: false
      failed_when: audit.rc not in [0, 1]

    - name: Audit summary
      ansible.builtin.debug:
        msg: "{{ audit.stdout_lines | last }}"
